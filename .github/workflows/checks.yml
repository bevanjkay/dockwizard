name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  build-and-test:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          XCODE="$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
      - name: Install tools
        run: brew install xcodegen swiftlint swiftformat
      - name: Lint
        run: make lint
      - name: Test packages
        run: make test
      - name: Integration test against a scratch preferences domain
        run: Scripts/integration-test.sh
      - name: Generate project
        run: make generate
      - name: Build app
        run: make build
