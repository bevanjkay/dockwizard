name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      HAS_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_ASC_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode
        run: |
          XCODE="$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
      - name: Install tools
        run: brew install xcodegen
      - name: Generate project
        run: make generate

      - name: Import Developer ID certificate
        id: cert
        if: env.HAS_CERT == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$DEVELOPER_ID_P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          echo "identity=Developer ID Application" >> "$GITHUB_OUTPUT"

      - name: Write App Store Connect key
        if: env.HAS_ASC_KEY == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Package
        id: package
        env:
          CODE_SIGN_IDENTITY: ${{ steps.cert.outputs.identity || '-' }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: Scripts/package.sh "${GITHUB_REF_NAME}"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DockWizard-${{ github.ref_name }}
          path: dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZED: ${{ steps.package.outputs.notarized }}
        run: |
          PRERELEASE=()
          [[ "${GITHUB_REF_NAME}" == *-* ]] && PRERELEASE=(--prerelease)
          if [[ "$NOTARIZED" == "true" ]]; then
            NOTES="Signed with Developer ID and notarised by Apple."
          else
            NOTES="This build is ad-hoc signed and not notarised. After installing, run \`xattr -d com.apple.quarantine /Applications/DockWizard.app\` or right-click › Open the first time."
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "DockWizard ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "$NOTES" \
            "${PRERELEASE[@]}"
