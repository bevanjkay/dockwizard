name: DockWizard
options:
  bundleIdPrefix: me.bevankay
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  DockWizardKit:
    path: Packages/DockWizardKit
targets:
  DockWizard:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: DockWizardKit
        product: DockCore
      - package: DockWizardKit
        product: PresetCore
    info:
      path: App/Info.plist
      properties:
        CFBundleName: DockWizard
        CFBundleDisplayName: DockWizard
        CFBundleIdentifier: me.bevankay.dockwizard
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "MIT License"
    entitlements:
      path: App/DockWizard.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.bevankay.dockwizard
schemes:
  DockWizard:
    build:
      targets:
        DockWizard: all
    run:
      config: Debug
    archive:
      config: Release
